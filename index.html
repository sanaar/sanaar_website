<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanaa Rahmat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf6f0 0%, #fce8e8 50%, #ece8fd 100%);
      padding: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
    }

    .avatar-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -0.3px;
      margin-bottom: 0.5rem;
    }

    .bio {
      font-size: 0.92rem;
      color: #6b7280;
      line-height: 1.6;
      font-weight: 400;
      max-width: 300px;
      margin: 0 auto 2rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #f472b6, #818cf8);
      border-radius: 2px;
      margin: 1.25rem auto;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      color: #374151;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .social-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      border-color: transparent;
    }

    .social-link.email:hover {
      color: #ea4335;
      box-shadow: 0 6px 20px rgba(234, 67, 53, 0.2);
    }

    .social-link.linkedin:hover {
      color: #0a66c2;
      box-shadow: 0 6px 20px rgba(10, 102, 194, 0.2);
    }

    .social-link svg {
      width: 22px;
      height: 22px;
    }

    .tooltip-wrapper {
      position: relative;
      display: inline-block;
    }

    .tooltip-wrapper::after {
      content: attr(data-label);
      position: absolute;
      bottom: -2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: #fff;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .tooltip-wrapper:hover::after {
      opacity: 1;
    }

    .location {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: #9ca3af;
      font-weight: 400;
    }

    .location svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrapper">
      <img src="avatar.png" alt="Sanaa Rahmat" />
    </div>

    <h1>Sanaa Rahmat</h1>
    <div class="divider"></div>
    <p class="bio">Computer Science student at UW Bothell. I'm passionate about coding and problem solving!</p>

    <div class="social-links">
      <div class="tooltip-wrapper" data-label="Email">
        <a class="social-link email" href="mailto:sanaa.r236@gmail.com" aria-label="Email">
          <!-- Mail icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </a>
      </div>

      <div class="tooltip-wrapper" data-label="LinkedIn">
        <a class="social-link linkedin" href="https://www.linkedin.com/in/sanaa-rahmat" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <!-- LinkedIn icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
      </div>
    </div>

    <p class="location">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      Seattle, WA
    </p>
  </div>
</body>
</html>
